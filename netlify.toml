[build]
  publish = "dist"
  command = "npm run build"

# Disable Netlify drawer / collaborative preview widget
[context.production.environment]
  NETLIFY_DRAWER = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashed build assets (JS, CSS, optimized images, fonts) never change
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Old image and audio URLs (indexed before the move to optimized assets)
[[redirects]]
  from = "/audio/bugis_tana_ogi_wanuakku.mp3"
  to = "/audio/tana-ogi-wanuakku.mp3"
  status = 301
[[redirects]]
  from = "/img/*"
  to = "/og-image.jpg"
  status = 301
